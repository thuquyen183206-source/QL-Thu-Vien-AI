services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: library_ai
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_pass
    ports: ["3307:3306"]
    volumes:
      - library_db:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: library_ai
      DB_USERNAME: library_user
      DB_PASSWORD: library_pass
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-12}
      AI_MAX_PROMPT_CHARS: ${AI_MAX_PROMPT_CHARS:-8000}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-24000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8090}
    ports: ["8000:80"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["8090:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default_charset.conf:ro
    depends_on: [backend]
volumes:
  library_db:
